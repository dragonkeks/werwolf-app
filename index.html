</style></head><body><header><h1>🌙 Werwolf · Spielleitung</h1><button class="tiny" id="home">Menü</button></header><main id="app" class="wrap"></main><script>
'use strict';
const R={
'Dorfbewohner':['Dorf','Keine Nachtaktion.'], 'Bärenführer':['Dorf','Morgens knurrt der Bär bei Werwolf/Spinne nebenan; bei Sehern böse.'], 'Freimaurer':['Dorf','Beide erkennen sich in Nacht 1.'], 'Hexe':['Dorf','Je einmal heilen und töten; darf in derselben Nacht beide Tränke einsetzen.'], 'Leibwächter':['Dorf','Schützt nachts ein anderes Haus; bei Wolfsangriff wird Leibwächter verletzt.'], 'Hure':['Dorf','Schläft bei einer anderen lebenden Person.'], 'Seherin':['Dorf','Prüft gut/böse am Ende der Nacht.'], 'Fallensteller':['Dorf','Schützt ein anderes Haus; bei Angriff verwundet er einen zufälligen Werwolf.'], 'Schütze':['Dorf','Bis zu zwei Tagesschüsse vor der Abstimmung.'], 'Gastwirt':['Dorf','Macht nachts eine Person betrunken: Entscheidungen/Stimmen wirkungslos, Infos falsch.'], 'Priester':['Dorf','Einmalig Weihwasser gegen Wolf, Vampir, Spinne.'], 'Schlaflose':['Dorf','Erfährt am Nachtende, ob eine Nachbarwohnung aktiv war.'], 'Bürgermeister':['Dorf','Stimme zählt doppelt.'], 'Fuchs':['Dorf','Schnüffelt Spieler und Nachbarn; bei keinem bösen/ Bärenführer verliert Fähigkeit.'], 'Totengräber':['Dorf','Sieht Rolle der zuletzt gelynchten Person.'],
'Werwolf':['Wolf','Wählt gemeinsam ein Angriffsziel.'], 'Urwolf':['Wolf','Wandelt einmalig eine Person ab nächster Nacht zum Werwolf.'], 'Wolfsschamanin':['Wolf','Wacht mit Wölfen auf; wird als gut gesehen.'], 'Einsamer Wolf':['Solo','Wacht mit Wölfen auf; darf einmalig einen Wolf töten; eigener Sieg.'], 'Vampir':['Vampir','Verletzt das Ziel; durch Verbluten gestorbene Person kehrt als Vampir zurück.'], 'Spinne':['Spinne','Webt ein Ziel ein oder löst einmalig das tödliche Netz aus.'],
'Wolfshund':['Variabel','Entscheidet in Nacht 1 zwischen Wolf und Dorf; sieht immer gut aus.'], 'Reisender':['Solo','Muss allein übrige Dorfbewohner auslöschen; erscheint böse.'], 'Narr':['Solo','Gewinnt, wenn er durch die Abstimmung gelyncht wird.'], 'Kopfgeldjäger':['Solo','Gewinnt, wenn das Ziel gelyncht wird; sonst Dorfbewohner bei anderem Tod.'], 'Dieb':['Variabel','Wählt in Nacht 1 eine unverteilte Rolle.'], 'Brandstifter':['Solo','Markiert nachts Häuser; gewinnt, wenn alle übrigen Lebenden markiert sind.']};
const GIFTS=['Idiot','Paranoider','Richter','Lykanthrop','Harter Bursche','Amor'];
const PRESETS={
'Einsteiger':{roles:{'Werwolf':3,'Dorfbewohner':4,'Seherin':1,'Hexe':1,'Leibwächter':1,'Bürgermeister':1},pool:['Bärenführer','Fallensteller','Schütze'],gifts:[]},
'Einsteiger+':{roles:{'Werwolf':3,'Dorfbewohner':2,'Freimaurer':2,'Seherin':1,'Hexe':1,'Bärenführer':1,'Bürgermeister':1},pool:['Gastwirt','Fuchs','Priester'],gifts:[]},
'Fortgeschritten':{roles:{'Werwolf':2,'Wolfsschamanin':1,'Dorfbewohner':2,'Seherin':1,'Fuchs':1,'Fallensteller':1,'Gastwirt':1,'Schlaflose':1,'Bürgermeister':1},pool:['Priester','Hure','Totengräber','Schütze'],gifts:['Lykanthrop']},
'Experten':{roles:{'Werwolf':2,'Urwolf':1,'Spinne':1,'Dorfbewohner':1,'Hexe':1,'Seherin':1,'Priester':1,'Fallensteller':1,'Totengräber':1,'Hure':1},pool:['Leibwächter','Bärenführer','Gastwirt','Fuchs'],gifts:['Harter Bursche','Richter']},
'Chaos':{roles:{'Werwolf':2,'Vampir':1,'Spinne':1,'Narr':1,'Dorfbewohner':1,'Hexe':1,'Seherin':1,'Leibwächter':1,'Schütze':1,'Bürgermeister':1},pool:['Kopfgeldjäger','Brandstifter','Wolfshund','Reisender'],gifts:['Amor','Paranoider']}
};
let s;const key='werwolf_malaga_v1';try{s=JSON.parse(localStorage.getItem(key))||{}}catch{s={}};s.page=s.page||'home';s.savedNames=s.savedNames||[];s.count=s.count||11;s.poolExtra=s.poolExtra??3;s.difficulty=s.difficulty||'Einsteiger';s.roles=s.roles||{};s.pool=s.pool||[];s.gifts=s.gifts||[];s.players=s.players||[];s.events=s.events||[];s.phase=s.phase||'setup';
const $=id=>document.getElementById(id),esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(key,JSON.stringify(s))}function setPage(p){s.page=p;save();render()}function total(){return Object.values(s.roles).reduce((a,b)=>a+b,0)}
function applyPreset(name){s.difficulty=name;const p=PRESETS[name];s.roles={...p.roles};s.pool=[...p.pool];s.gifts=[...p.gifts];s.count=11;s.poolExtra=p.pool.length;save();render()}
function el(html){$('app').innerHTML=html}function btn(t,func,cl=''){return `<button class="${cl}" data-action="${func}">${t}</button>`}function playerById(id){return s.players.find(p=>p.id===+id)}function alive(){return s.players.filter(p=>p.alive)}function byRole(name){return alive().filter(p=>p.role===name)}function faction(p){if(p.role==='Wolfshund')return p.side||'Variabel';return R[p.role]?.[0]||'Dorf'}function isWolf(p){return faction(p)==='Wolf'||p.role==='Einsamer Wolf'}function isEvil(p){return ['Wolf','Vampir','Spinne'].includes(faction(p))||p.role==='Einsamer Wolf'}function see(p){let evil=isEvil(p)||['Bärenführer','Reisender'].includes(p.role)||p.gift?.includes('Lykanthrop');if(['Wolfsschamanin','Wolfshund'].includes(p.role))evil=false;return evil?'Böse':'Gut'}function neighbors(p){let a=s.players;let i=a.indexOf(p);return [a[(i+a.length-1)%a.length],a[(i+1)%a.length]]}function log(t){s.events.unshift(`Nacht/Tag ${s.day||1}: ${t}`);s.events=s.events.slice(0,150)}function rand(a){return a[Math.floor(Math.random()*a.length)]}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function name(id){return playerById(id)?.name||'?' }
function selectOptions(arr,selected='',placeholder='Ziel wählen'){return `<option value="">${placeholder}</option>`+arr.map(p=>`<option value="${p.id}" ${+selected===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}
function home(){el(`<h2>Deine Spielleitung</h2><p>Offlinefähige Einzeldatei · lokale Speicherung auf diesem Gerät · Moderatoransicht (nicht für Mitspieler sichtbar).</p><div class="card"><h3>Neue Partie</h3><p>Rollenpool → Namen → geheime Verteilung → geführte Nacht → Tag & Abstimmung.</p>${btn('Neue Partie einrichten','new','primary')} ${btn('Testmodus öffnen','tests')}</div>${s.players.length?`<div class="card"><h3>Letzte Partie</h3><p>${s.players.length} Personen · ${esc(s.phase)} · Tag ${s.day||1}</p>${btn('Partie fortsetzen','resume','primary')} ${btn('Partie löschen','wipe','danger')}</div>`:''}<div class="card"><h3>Regelhinweis</h3><p>Die App löst die wichtigsten Nacht- und Tagesaktionen automatisch auf. Sonderfälle, unklare Wechselwirkungen und komplexe Solo-Siegbedingungen müssen vom Spielleiter bestätigt werden. Spielstatus und Protokoll bleiben editierbar.</p></div>`)}
function settings(){el(`<h2>1 · Partie vorbereiten</h2><div class="card"><label>Personenzahl</label><input id="count" type="number" min="5" max="30" value="${s.count}"><label>Schwierigkeit / Vorlage</label><select id="difficulty">${Object.keys(PRESETS).map(n=>`<option ${n===s.difficulty?'selected':''}>${n}</option>`).join('')}<option value="Custom" ${s.difficulty==='Custom'?'selected':''}>Custom</option></select><label>Zusätzliche, unverteilte Pool-Rollen</label><input id="extra" type="number" min="0" max="20" value="${s.poolExtra}"><p class="small">Vorlagen sind für genau 11 Personen ausgelegt. Bei abweichender Personenzahl musst du die Rollen manuell ergänzen/reduzieren.</p></div><div class="card"><h3>Verteilte Rollen <span class="pill">${total()} / ${s.count}</span></h3>${validation()?`<div class="notice" role="alert">⚠️ ${esc(validation())}</div>`:''}${Object.keys(R).map(n=>`<div class="role"><span>${esc(n)} <small class="muted">· ${R[n][0]}</small></span><div class="counter"><button data-role="${esc(n)}" data-delta="-1">−</button><b>${s.roles[n]||0}</b><button data-role="${esc(n)}" data-delta="1">+</button></div></div>`).join('')}</div><div class="card"><h3>Unverteilte Rollen <span class="pill">${s.pool.length} / ${s.poolExtra}</span></h3><p>Diese Karten bleiben außerhalb des Spiels. Der Dieb kann daraus wählen.</p>${Object.keys(R).map(n=>`<label class="row"><span>${esc(n)}</span><input class="switch" type="checkbox" data-pool="${esc(n)}" ${s.pool.includes(n)?'checked':''}></label>`).join('')}</div><div class="card"><h3>Gaben (optional)</h3><p>Aktivierte Gaben werden per Zufall zusätzlich an einzelne Rollen vergeben. Du kannst sie nach dem Verteilen bearbeiten.</p>${GIFTS.map(g=>`<label class="row"><span>${g}</span><input class="switch" type="checkbox" data-gift="${g}" ${s.gifts.includes(g)?'checked':''}></label>`).join('')}</div><div class="actions">${btn('Weiter zu den Spielern','toNames','primary')} ${btn('Zurück','home')}</div>`)}
function validation(){if(total()!==s.count)return `Spielstart nicht möglich: ${total()} Rollen für ${s.count} Personen. ${total()>s.count?`Bitte ${total()-s.count} Rolle(n) entfernen.`:`Bitte ${s.count-total()} Rolle(n) ergänzen.`}`;if(s.pool.length!==s.poolExtra)return `Spielstart nicht möglich: ${s.pool.length} statt ${s.poolExtra} unverteilte Pool-Rollen. Bitte Auswahl oder Zahl anpassen.`;if((s.roles.Freimaurer||0)%2!==0)return 'Freimaurer dürfen nur paarweise auftreten.';if((s.roles.Freimaurer||0)>2)return 'Es dürfen höchstens zwei Freimaurer im Spiel sein.';for(let [r,n] of Object.entries(s.roles))if(n>1&&!['Werwolf','Dorfbewohner','Freimaurer'].includes(r))return `${r} ist nur einmal erlaubt.`;if(s.gifts.length>s.count)return 'Zu viele Gaben.';if(s.gifts.includes('Lykanthrop')&&s.count-s.roles.Werwolf-(s.roles.Urwolf||0)-(s.roles.Wolfsschamanin||0)-(s.roles.Vampir||0)-(s.roles.Spinne||0)<1)return 'Kein gültiger Empfänger für Lykanthrop.';return ''}
function names(){el(`<h2>2 · Spielerliste</h2><p>Die Sitzreihenfolge ist wichtig für Bärenführer, Fuchs und Schlaflose. Spieler werden lokal gespeichert.</p><div class="card">${Array.from({length:s.count},(_,i)=>`<label>Platz ${i+1}<input data-name="${i}" value="${esc(s.draftNames?.[i]??s.savedNames[i]??'')}" placeholder="Name"></label>`).join('')}</div><div class="actions">${btn('Rollen zufällig verteilen','deal','primary')} ${btn('Rollen ändern','settings')}</div>`)}
function setupDeal(){el(`<h2>3 · Geheime Verteilung</h2><p>Nur der Spielleiter sieht diese Übersicht. Weise die haptischen Rollensteine entsprechend zu.</p><div class="card">${s.players.map(p=>`<div class="player"><div class="row"><b>${esc(p.name)}</b><span>${esc(p.role)} ${p.gift.length?' · 🎁 '+esc(p.gift.join(', ')):''}</span></div></div>`).join('')}</div><div class="notice">Wichtig: In dieser Übersicht kannst du Rollen und Gaben vor Spielbeginn korrigieren. Geheim halten!</div><div class="card">${s.players.map(p=>`<details><summary>${esc(p.name)} bearbeiten</summary><label>Rolle</label><select data-change-role="${p.id}">${Object.keys(R).map(n=>`<option ${p.role===n?'selected':''}>${esc(n)}</option>`).join('')}</select><label>Gabe(n) — komma-getrennt</label><input data-change-gift="${p.id}" value="${esc(p.gift.join(', '))}"></details>`).join('')}</div><div class="actions">${btn('Erste Nacht starten','start','primary')} ${btn('Neu mischen','reshuffle')} ${btn('Namen ändern','names')}</div>`)}
function initialDeal(){let roles=Object.entries(s.roles).flatMap(([r,n])=>Array(n).fill(r));roles=shuffle(roles);let gifts=shuffle([...s.gifts]);s.players=(s.draftNames||s.savedNames).slice(0,s.count).map((n,i)=>({id:i+1,name:n||`Spieler ${i+1}`,role:roles[i],original:roles[i],gift:[],alive:true,injured:false,pendingVampire:false,ghostVote:false,web:false,gas:false,hardUsed:false}));let giftRecipients=shuffle([...s.players]);for(let i=0;i<gifts.length;i++){let eligible=giftRecipients.find(p=>!p.gift.length&&!(gifts[i]==='Lykanthrop'&&isEvil(p)));if(eligible){eligible.gift=[gifts[i]];giftRecipients=giftRecipients.filter(p=>p!==eligible)}}for(let hunter of s.players.filter(p=>p.role==='Kopfgeldjäger')){let choices=s.players.filter(p=>p.id!==hunter.id&&p.role!=='Narr');hunter.bounty=rand(choices)?.id||null} s.day=1;s.phase='assigned';s.events=[];s.used={};s.pendingConversions=[];s.lastLynched=null;s.winner=null;s.ended=false;s.lastSettings={count:s.count,poolExtra:s.poolExtra,difficulty:s.difficulty,roles:{...s.roles},pool:[...s.pool],gifts:[...s.gifts]};save()}
const FIRST=['Dieb','Kopfgeldjäger','Amor','Verliebte','Wolfshund','Freimaurer','Hure','Leibwächter','Fallensteller','Gastwirt','Brandstifter','Spinne','Vampir','Werwolf','Einsamer Wolf','Urwolf','Hexe','Priester','Fuchs','Seherin','Schlaflose'];const LATER=['Totengräber','Hure','Leibwächter','Fallensteller','Gastwirt','Brandstifter','Spinne','Vampir','Werwolf','Einsamer Wolf','Urwolf','Hexe','Priester','Fuchs','Seherin','Schlaflose'];
function nightSteps(){let steps=[];let possible=new Set([...Object.keys(s.roles).filter(k=>s.roles[k]>0),...(s.pool||[]),...s.players.map(p=>p.original),...s.players.map(p=>p.role)]);if(s.gifts?.includes('Amor')||s.players.some(p=>p.gift?.includes('Amor')))possible.add('Amor');if(possible.has('Amor'))possible.add('Verliebte');for(let n of (s.day===1?FIRST:LATER)){if(!possible.has(n))continue;if(n==='Verliebte'){steps.push({role:n,placeholder:!s.players.some(p=>p.lover),reason:'Kein aktives Liebespaar'});continue}if(n==='Amor'){let actors=alive().filter(p=>p.gift.includes('Amor'));steps.push(actors.length?{role:n,actor:actors[0].id}:{role:n,placeholder:true,reason:'Gabe nicht verteilt oder Spieler verstorben'});continue}if(n==='Werwolf'){if(alive().some(isWolf))steps.push({role:n});else steps.push({role:n,placeholder:true,reason:'Keine lebenden Werwölfe'});continue}let occupants=s.players.filter(p=>p.role===n||p.original===n);let live=occupants.filter(p=>p.alive&&p.role===n);if(n==='Freimaurer'){steps.push(live.length?{role:n,actor:live[0].id}:{role:n,placeholder:true,reason:occupants.length?'Bereits verstorben':'Nicht verteilt'});continue}if(!live.length){steps.push({role:n,placeholder:true,reason:occupants.length?'Bereits verstorben oder Rolle gewechselt':'Nicht verteilt'});continue}for(let p of live)steps.push({role:n,actor:p.id})}return steps}

function newNight(){if(s.ended){alert('Diese Partie wurde beendet.');return}s.phase='night';s.nightIndex=0;s.acts={guard:null,trap:null,drunk:null,wolf:null,vamp:null,prostitute:null,poison:null,heal:null,priest:null,web:null,fire:false,seer:null,fox:null,grave:null,shot:[],active:[],vampireRise:[]};for(let p of s.players){p.gas=false;p.noBleed=false;p.injured=false}for(let x of (s.pendingConversions||[])){let p=playerById(x.id);if(p&&!p.alive&&x.type==='vamp'){p.alive=true;p.pendingVampire=false;p.ghostVote=false;p.role='Vampir';p.gift=[];p.lover=null;s.acts.vampireRise.push(p.id);log(`${p.name} ist als Vampir auferstanden.`)}else if(p&&p.alive&&x.type==='wolf'){p.role='Werwolf';p.ghostVote=false;p.gift=[];p.lover=null;log(`${p.name} wurde zum Werwolf.`)}}s.pendingConversions=[];for(let ar of byRole('Brandstifter'))if(alive().every(q=>q.id===ar.id||q.gasoline)){s.winner=`Brandstifter: ${ar.name}`;log(`${ar.name} gewinnt durch Brandstiftung zu Beginn der Nacht.`)}s.deathRecords=[];s.nightAttacks=[];s.steps=nightSteps();save();render()}
function night(){let x=s.steps[s.nightIndex];if(!x){resolveNight();return}let actor=x.actor?playerById(x.actor):null,n=x.role;if(x.placeholder){el(`<h2>🌙 Nacht ${s.day}</h2><div class="card"><span class="pill">Schritt ${s.nightIndex+1} von ${s.steps.length}</span><h2>${esc(n)} erwacht</h2><p class="warn">${esc(x.reason||'Nicht aktiv')}</p><p>Diese Rolle wird weiterhin angesagt, führt aber keine Aktion aus.</p>${btn('Weiter','next','primary')} ${btn('Vorheriger Schritt','prev')}</div>`);return}let special=n==='Vampir'&&s.acts.vampireRise?.length?`Wiederauferstanden: ${s.acts.vampireRise.map(id=>name(id)).join(', ')}`:n==='Hexe'?`Tränke: Heilung ${s.used.heal?'verbraucht':'bereit'}, Gift ${s.used.poison?'verbraucht':'bereit'}`:n==='Spinne'?`Netz-Auslösung ${s.used.webkill?'verbraucht':'bereit'}`:'';
let html=`<h2>🌙 Nacht ${s.day}</h2><div class="row"><span class="pill">Schritt ${s.nightIndex+1} von ${s.steps.length}</span><span class="pill">${esc(n)}</span></div><div class="card"><h2>${esc(n)}</h2><p>${esc(R[n]?.[1]||'Wähle ein Ziel.')}</p>${actor?`<p class="gold">Wach: ${esc(actor.name)}</p>`:''}${special?`<p class="gold">${special}</p>`:''}`;
const options=(excludeSelf=true)=>alive().filter(p=>!excludeSelf||p.id!==actor?.id);
const choice=(kind,arr=options(),hint='Ziel wählen',mandatory=false,selected='')=>`<select id="target">${selectOptions(arr,selected,hint)}</select><div class="actions">${btn('Aktion bestätigen','act_'+kind,'primary')} </div>`;

case 'Amor':case 'Kopfgeldjäger':case 'Leibwächter':case 'Fallensteller':case 'Gastwirt':case 'Hure':case 'Priester':case 'Seherin':case 'Fuchs':case 'Totengräber':case 'Vampir':case 'Brandstifter': {let targets=n==='Totengräber'?s.players.filter(p=>!p.alive):options(n!=='Kopfgeldjäger');if(n==='Kopfgeldjäger')targets=targets.filter(p=>p.id!==actor.id&&p.role!=='Narr');let mandatory=['Amor','Kopfgeldjäger','Vampir','Brandstifter'].includes(n);html+=`<p class="small">${n==='Kopfgeldjäger'?'Ziel bereits zufällig festgelegt. Nur bei Bedarf korrigieren und bestätigen.':''}</p>`+choice(n,targets,n==='Totengräber'?'Toten wählen':'Ziel wählen',mandatory,n==='Kopfgeldjäger'?actor.bounty:'');if(n==='Seherin'||n==='Fuchs')html+=`<div class="card"><h3>Spielleiterhilfe – Rollenübersicht</h3><p class="small">Geheim halten. Nach Bestätigung erscheint die Auskunft zur Auswahl.</p>${s.players.map(q=>`<div class="row"><span>${esc(q.name)}</span><b>${esc(q.role)}${q.gift.length?' · '+esc(q.gift.join(', ')):''}</b></div>`).join('')}</div>`;break}
case 'Verliebte':html+=`<p>Das Liebespaar erkennt sich: ${s.players.filter(p=>p.lover).map(p=>esc(p.name)).join(' und ')||'noch nicht festgelegt'}.</p>${btn('Weiter','next','primary')}`;break;case 'Freimaurer':html+=`<p>Die beiden Freimaurer öffnen die Augen und erkennen sich.</p>${btn('Weiter','next','primary')}`;break;
case 'Werwolf':html+=`<p>Alle Werwölfe (inkl. Wolfshund-Wolf und Einsamem Wolf) wählen das Angriffsziel.</p>${choice('Werwolf',alive().filter(p=>!isWolf(p)),'Ziel wählen',true)}`;break;
case 'Urwolf':html+=s.used.urwolf?`<p>Fähigkeit bereits verbraucht.</p>${btn('Weiter','next','primary')}`:choice('Urwolf',alive().filter(p=>!isWolf(p)));break;

case 'Spinne':html+=`<p>Im Netz: ${s.players.filter(p=>p.web&&p.alive).map(p=>esc(p.name)).join(', ')||'niemand'}</p><div class="actions">${!s.used.webkill?btn('Netz auslösen','webkill','danger'):''}</div>${choice('Spinne')}`;break;
case 'Hexe':html+=`<p>Vorgemerkte Opfer: ${[s.acts.wolf,s.acts.vamp].filter(Boolean).map(id=>esc(name(id))).join(', ')||'keine'}</p><p class="small">Beide Tränke dürfen in derselben Nacht eingesetzt werden. Ohne Auswahl wird ein Trank nicht benutzt.</p><label>Heiltrank ${s.used.heal?'(bereits verbraucht)':''}</label><select id="healTarget" ${s.used.heal?'disabled':''}>${selectOptions(s.players.filter(p=>p.alive||s.nightAttacks?.some(x=>x.id===p.id)),'','Nicht benutzen')}</select><label>Todestrank ${s.used.poison?'(bereits verbraucht)':''}</label><select id="poisonTarget" ${s.used.poison?'disabled':''}>${selectOptions(alive(),'','Nicht benutzen')}</select><div class="actions">${btn('Beide Entscheidungen bestätigen','witchBoth','primary')}</div>`;break;
case 'Schlaflose':html+=`<p>${neighbors(actor).some(p=>s.acts.active.includes(p.id))?'Aktivität in mindestens einem Nachbarhaus.':'Keine erfasste Aktivität in den Nachbarhäusern.'}</p>${btn('Weiter','next','primary')}`;break;

html+=`</div><div class="actions">${!['Verliebte','Freimaurer','Schlaflose'].includes(n)?btn('Weiter','next','primary'):''} ${btn('Vorheriger Schritt','prev')} ${btn('Nacht manuell abschließen','finishNight')}</div><div class="card"><details><summary>Nachtprotokoll anzeigen</summary>${feed()}</details></div>`;el(html)}
function feed(){return `<div class="feed">${s.events.slice(0,25).map(e=>`<div>${esc(e)}</div>`).join('')||'<div>Noch keine Ereignisse</div>'}</div>`}
function next(){let step=s.steps?.[s.nightIndex];if(step&&!step.placeholder){const r=step.role;let issue='';if(r==='Werwolf'&&!s.acts.wolf)issue='Die Werwölfe müssen ein Angriffsziel auswählen.';else if(r==='Vampir'&&!s.acts.vamp)issue='Der Vampir muss ein Angriffsziel auswählen.';else if(r==='Spinne'&&!s.acts.fire&&!s.acts.spiderWoven)issue='Die Spinne muss ein Ziel einweben oder das Netz auslösen.';else if(r==='Wolfshund'&&!playerById(step.actor)?.side)issue='Der Wolfshund muss sich für eine Seite entscheiden.';else if(r==='Dieb'&&!s.acts.thiefDone)issue='Der Dieb muss eine Rolle übernehmen.';else if(r==='Amor'&&!s.used.amor)issue='Amor muss ein Liebespaar bestimmen.';else if(r==='Brandstifter'&&!s.acts.arsonDone)issue='Der Brandstifter muss ein Haus markieren.';else if(r==='Kopfgeldjäger'&&!playerById(step.actor)?.bounty)issue='Für den Kopfgeldjäger fehlt ein gültiges Ziel.';if(issue){alert(issue);return}}s.nightIndex=Math.min(s.nightIndex+1,s.steps.length);save();render()}function resolveNight(){let a=s.acts,nightDeaths=new Set(),inj=new Set();
const atk=(id,source)=>{let p=playerById(id);if(!p||!p.alive)return;if(source==='vamp'&&a.trap===id){log(`Falle bei ${p.name} durch Vampir ausgelöst – ohne Wirkung.`)}if(source==='wolf'&&a.trap===id){let wolves=alive().filter(isWolf);if(wolves.length)inj.add(rand(wolves).id);log(`Falle schützt ${p.name}; zufälliger Wolf wird verletzt.`);return}if(source==='wolf'&&a.guard===id){let guard=byRole('Leibwächter')[0];if(guard){inj.add(guard.id);log(`Leibwächter schützt ${p.name} und wird verletzt.`);return}}if(p.role==='Hure'&&a.prostitute&&a.prostitute!==p.id){log(`${p.name} war nicht zuhause.`);return}let targets=[p];if(a.prostitute===p.id){let h=byRole('Hure')[0];if(h&&h.id!==p.id)targets.push(h)}for(let q of targets){if(q.gift.includes('Harter Bursche')&&!q.hardUsed){q.hardUsed=true;inj.add(q.id);log(`${q.name}: Harter Bursche fängt tödlichen Angriff ab.`)}else if(source==='vamp'){inj.add(q.id);q.pendingVampire=true;log(`${q.name} durch Vampir verletzt; Verwandlung nur bei späterem Verbluten.`)}else{nightDeaths.add(q.id);q.pendingVampire=false;log(`${q.name} durch ${source==='wolf'?'Werwolf':'tödlichen Angriff'} getötet; keine Vampirverwandlung.`)}}};
for(let hit of (s.nightAttacks||[])){let other=(s.nightAttacks||[]).find(h=>h!==hit&&h.id===hit.id&&h.kind!==hit.kind);if(other){let candidates=alive().filter(q=>hit.kind==='wolf'?isWolf(q):q.role==='Vampir');let hitActor=rand(candidates);if(hitActor){inj.add(hitActor.id);if(hit.kind==='vamp')hitActor.noBleed=true;log(`${hitActor.name} wird durch einen konkurrierenden Angriff verletzt.`)}}if(!nightDeaths.has(hit.id))atk(hit.id,hit.kind)}if(a.poison)atk(a.poison,'poison');if(a.priest){let p=playerById(a.priest);if(p&&isEvil(p))nightDeaths.add(p.id)}if(a.fire){for(let p of alive().filter(p=>p.web))nightDeaths.add(p.id)}if(a.heal){nightDeaths.delete(a.heal);inj.delete(a.heal);playerById(a.heal).pendingVampire=false}
for(let id of nightDeaths)kill(playerById(id),'Nachtangriff');for(let id of inj)if(playerById(id)?.alive)playerById(id).injured=true;
let chain=true;while(chain){chain=false;for(let p of s.players.filter(p=>!p.alive)){if(p.lover){let l=playerById(p.lover);if(l?.alive){kill(l,`Liebeskummer (${p.name})`);chain=true}}}}
s.phase='day';s.dayDeathIds=(s.deathRecords||[]).map(x=>x.id);s.dayDeaths=s.dayDeathIds.map(name);log(`Nacht beendet. Todesfälle: ${s.dayDeaths.join(', ')||'keine'}. ${alive().some(p=>p.injured)?'Mindestens eine Verletzung.':''}`);save();render()}
function kill(p,why){if(!p||!p.alive)return;s.deathRecords=s.deathRecords||[];s.deathRecords.push({id:p.id,role:p.role,gift:[...p.gift],why});p.alive=false;log(`${p.name} stirbt (${why}).`)}
function voteWeight(p){return p.gas||p.gift.includes('Idiot')?0:p.role==='Bürgermeister'?2:1}
function day(){let deaths=s.dayDeaths||[];let growls=byRole('Bärenführer');let injured=alive().filter(p=>p.injured);let html=`<h2>☀️ Tag ${s.day}</h2><div class="card"><h3>Ansage ans Dorf</h3><p>Nachts gestorben: <b>${deaths.length?deaths.map(esc).join(', '):'Niemand'}</b></p><p>${injured.length?'<b class="warn">Es gibt mindestens eine verletzte Person.</b>':'Keine Verletzung bekannt.'}</p>${growls.length?`<button data-action="bear" class="primary">🐻 Bärenführer · Prüfen / Knurren</button><div id="bearPanel" style="display:none"><p>Knurren selbst auslösen, wenn ein relevanter Nachbar vorhanden ist.</p></div>`:''}<details><summary>🐻 Relevante böse Rollen anzeigen</summary><p>${alive().filter(p=>['Wolf','Spinne'].includes(faction(p))||p.role==='Einsamer Wolf').map(p=>esc(p.name)+' ('+esc(p.role)+')').join(', ')||'Keine'}</p><p class='small'>Sitznachbarn des Bärenführers eigenständig prüfen; keine automatische Ansage.</p></details><p class="small">Interne Info: ${injured.map(p=>esc(p.name)).join(', ')||'keine Verletzten'}</p>${s.acts?.vampireRise?.length?`<p class="warn">Vampire auferstanden: ${s.acts.vampireRise.map(name).map(esc).join(', ')}</p>`:''}</div>`;
if(byRole('Schütze').length)html+=`<div class="card"><h3>Tagesschuss (vor Wahl)</h3><label>Ziel</label><select id="shotTarget">${selectOptions(alive().filter(p=>p.role!=='Schütze'))}</select>${btn('Schuss abgeben','shoot','danger')}<p class="small">Bis zu 2 Schüsse. Bei einem Dorf-Treffer stirbt stattdessen der Schütze.</p></div>`;

function resolveDay(lynchId,judge=false){let victim=playerById(lynchId);if(victim?.alive){kill(victim,'Abstimmung');s.lastLynched=victim.id;if(victim.role==='Narr'){s.winner=`Narr: ${victim.name}`;log(`${victim.name} gewinnt als Narr.`)}for(let p of byRole('Kopfgeldjäger'))if(victim.role!=='Narr'&&p.bounty===victim.id&&!s.winner){s.winner=`Kopfgeldjäger: ${p.name}`;log(`${p.name} erfüllt Kopfgeld.`)}}if(judge)log('Richter beendet Abstimmung ohne Hinrichtung.');let injured=alive().filter(p=>p.injured);for(let p of injured){if(p.role==='Vampir'||p.noBleed){p.injured=false;continue}kill(p,'Verbluten am Tagesende');if(p.pendingVampire)s.pendingConversions.push({type:'vamp',id:p.id})}for(let p of s.players.filter(p=>!p.alive&&p.lover)){let l=playerById(p.lover);if(l?.alive)kill(l,`Liebeskummer (${p.name})`)};for(let p of byRole('Kopfgeldjäger'))if(p.bounty&&!playerById(p.bounty)?.alive&&p.bounty!==lynchId){p.role='Dorfbewohner';log(`${p.name} wird Dorfbewohner (Kopfgeldziel anders gestorben).`)}s.phase='afterDay';s.endDeathIds=(s.deathRecords||[]).map(x=>x.id).filter(id=>!(s.dayDeathIds||[]).includes(id));s.endDeaths=s.endDeathIds.map(name);s.nominees=[];save();render()}
function afterDay(){let status=checkWinner();el(`<h2>🌆 Tagesende ${s.day}</h2><div class="card"><h3>Für den Spielleiter</h3><p>Verstorbene dieser Runde (Nacht und Tag):</p>${deathCards()}<p>Verletzungen abgearbeitet, nächste Runde vorbereitet.</p>${(s.pendingConversions||[]).length?`<p class="gold">Vampir-Auferstehung zu Beginn der nächsten Nacht: ${s.pendingConversions.map(x=>esc(name(x.id))).join(', ')}</p>`:''}${s.winner?`<h3 class="gold">🏆 ${esc(s.winner)}</h3>`:''}${status?`<p class="gold">${esc(status)}</p>`:''}</div><div class="actions">${!s.ended?btn('Nächste Nacht','nextNight','primary'):''} ${btn('Sieger festlegen','manualWin')} ${btn('Sieg prüfen','winCheck')} ${btn('Protokoll','log')}</div>`)}
function checkWinner(){if(s.winner)return s.winner;let a=alive();let lovers=s.players.filter(p=>p.lover);if(lovers.length===2&&lovers.every(p=>p.alive)&&a.length===2&&a.every(p=>p.lover)){return `Liebespaar-Sieg: ${lovers.map(p=>p.name).join(' und ')} – einzige Überlebende.`}if(lovers.some(p=>p.alive))return 'Liebespaar ist noch im Spiel: Fraktionssiege allein reichen nicht. Das Paar gewinnt nur als die letzten zwei Überlebenden.';if(!a.length)return 'Niemand lebt – Gewinner manuell festlegen.';let wolves=a.filter(p=>faction(p)==='Wolf');let villagers=a.filter(p=>faction(p)==='Dorf');if(wolves.length>=villagers.length&&wolves.length>0){return `Werwölfe (${wolves.length}) mindestens so zahlreich wie Dorf (${villagers.length}). Möglicher Wolfsieg – tötende Dorfaktionen und andere Fraktionen/Ziele noch prüfen oder Sieger manuell festlegen.`}let groups=new Set(a.map(faction));if(groups.size===1){let group=[...groups][0];if(group==='Dorf'||group==='Wolf'||group==='Vampir'||group==='Spinne'){return `Möglicher Fraktionssieg: ${group}. Sonderziele prüfen.`}}if(!a.some(isEvil)&&!a.some(p=>['Brandstifter','Reisender','Einsamer Wolf','Spinne','Narr','Kopfgeldjäger'].includes(p.role)))return 'Möglicher Dorfsieg – Sonderziele prüfen.';return 'Noch keine eindeutige automatische Siegbedingung. Neutral- und Liebespaarziele manuell beachten.'}

function render(){document.title=`Werwolf · ${s.page}`;if(s.page==='home')home();else if(s.page==='settings')settings();else if(s.page==='names')names();else if(s.page==='deal')setupDeal();else if(s.page==='log')logs();else if(s.page==='tests')testsPage();else if(s.page==='winner')winnerPage();else if(s.ended)victoryPage();else if(s.phase==='night')night();else if(s.phase==='day')day();else if(s.phase==='afterDay')afterDay();else if(s.phase==='assigned')setupDeal();else home();showRoster();let header=document.querySelector('header');if(header){let w=document.getElementById('wwdelete');if(w)w.remove();document.getElementById('wwmanualwin')?.remove();if(s.players.length){let button=document.createElement('button');button.id='wwdelete';button.className='tiny danger';button.dataset.action='wipe';button.textContent='🗑️ Partie löschen';header.append(button);if(!s.ended&&s.phase!=='assigned'){let end=document.createElement('button');end.id='wwmanualwin';end.className='tiny';end.dataset.action='manualWin';end.textContent='🏆 Partie beenden';header.append(end)}}}}
function act(kind){let x=s.steps[s.nightIndex],actor=x.actor?playerById(x.actor):null,t=+$('target')?.value,p=playerById(t);if(!p&&kind!=='skip'){alert('Bitte ein Ziel auswählen.');return}let a=s.acts;if(actor)a.active.push(actor.id);if(actor?.gas&&!['Seherin','Fuchs','Totengräber'].includes(kind)){log(`${actor.name} handelt betrunken: Aktion ist wirkungslos.`);next();return}const use=(k)=>{s.used[k]=true};
switch(kind){case 'Amor':if(actor.id===t)return alert('Amor braucht einen anderen Spieler.');actor.lover=p.id;p.lover=actor.id;use('amor');break;case 'Kopfgeldjäger':if(p.id===actor.id||p.role==='Narr')return alert('Der Narr und der Kopfgeldjäger selbst dürfen keine Kopfgeldziele sein.');actor.bounty=t;break;case 'Leibwächter':a.guard=t;break;case 'Fallensteller':a.trap=t;break;case 'Gastwirt':a.drunk=t;p.gas=true;break;case 'Hure':a.prostitute=t;break;case 'Priester':if(s.used.priest)return alert('Weihwasser verbraucht.');a.priest=t;use('priest');break;case 'Seherin':a.seer=t;alert(`Seherin – ${p.name}\nTatsächliche Rolle: ${p.role}${p.gift.length?' · Gabe: '+p.gift.join(', '):''}\nSehergebnis: ${actor.gas?(see(p)==='Gut'?'Böse':'Gut'):see(p)}`);break;case 'Fuchs':{if(s.used.fox)return alert('Fuchs hat Fähigkeit verloren.');let pos=[p,...neighbors(p)].some(q=>isEvil(q)||q.role==='Bärenführer');if(actor.gas)pos=!pos;alert(`Fuchs – ${p.name}\n${[p,...neighbors(p)].map(q=>q.name+': '+q.role).join('\n')}\nErgebnis: ${pos?'Positiv':'Negativ'}`);if(!pos)use('fox');break}case 'Totengräber':alert(`Totengräber sieht ${p.name}: ${actor.gas?'Falsche Auskunft – SL improvisiert':p.role}`);break;case 'Vampir':a.vamp=t;s.nightAttacks.push({kind:'vamp',id:t});break;case 'Werwolf':a.wolf=t;s.nightAttacks.push({kind:'wolf',id:t});break;case 'Urwolf':s.pendingConversions.push({type:'wolf',id:t});use('urwolf');break;case 'Einsamer Wolf':kill(p,'Einsamer Wolf');use('lone'+actor.id);break;case 'Spinne':p.web=true;a.spiderWoven=true;break;case 'Brandstifter':p.gasoline=true;a.arsonDone=true;break;case 'Hexe':{let what=$('which').value;if(s.used[what])return alert('Trank ist verbraucht.');a[what]=t;use(what);log(`Hexe: ${what==='heal'?'Heilung':'Gift'} auf ${p.name}`);save();render();return}}log(`${x.role}: ${actor?.name||'Gruppe'} → ${p.name}`);next()}
// Ton lässt sich per Benutzerklick starten; Zustand bleibt beim Phasenwechsel erhalten.
function rosterPanel(){if(!s.players.length)return '';let live=alive(),ghost=s.players.filter(p=>!p.alive);return `<details class="card" id="roster"><summary><b>📋 Spielübersicht</b> · ${live.length} lebend · ${ghost.filter(p=>!p.ghostVote).length} Geisterstimmen übrig</summary><h3>Lebende Spieler</h3>${live.map(p=>`<div class="row player"><span>${esc(p.name)}</span><span><b>${esc(p.role)}</b>${p.gift?.length?' · '+esc(p.gift.join(', ')):''}${p.injured?' · <span class="warn">verletzt</span>':''}${p.lover?' · ♥ '+esc(name(p.lover)):''}</span></div>`).join('')||'<p>Niemand mehr am Leben.</p>'}<h3>Geister</h3>${ghost.map(p=>`<div class="row player"><span>${esc(p.name)} · ${esc(p.role)}</span><b class="${p.ghostVote?'muted':'gold'}">${p.ghostVote?'Stimme verbraucht':'👻 1 Stimme frei'}</b></div>`).join('')||'<p>Keine Geister.</p>'}<div class="notice">Siegstatus: ${esc(checkWinner())}</div></details>`}
function showRoster(){let old=document.getElementById('rosterWrap');if(old)old.remove();if(!s.players.length||s.page==='home'||s.page==='settings'||s.page==='names'||s.page==='deal'||s.page==='tests'||s.page==='winner')return;let container=document.createElement('div');container.id='rosterWrap';container.innerHTML=rosterPanel();$('app').prepend(container)}
function deleteGame(){let keep=[...(s.savedNames||[])],last=s.lastSettings||{count:s.count,poolExtra:s.poolExtra,difficulty:s.difficulty,roles:s.roles,pool:s.pool,gifts:s.gifts};try{localStorage.removeItem(key)}catch(e){console.warn('Speicher',e)}s={page:'home',savedNames:keep,count:last.count||11,poolExtra:last.poolExtra??3,difficulty:last.difficulty||'Einsteiger',roles:{...last.roles},pool:[...(last.pool||[])],gifts:[...(last.gifts||[])],lastSettings:last,players:[],events:[],phase:'setup',day:1};save();render();let e=document.getElementById('deletedNotice');if(!e){e=document.createElement('div');e.id='deletedNotice';e.className='notice';$('app').prepend(e)}e.textContent='Die Partie wurde gelöscht. Gespeicherte Spielernamen bleiben erhalten.'}
function deathCards(){let ids=new Set((s.dayDeathIds||[]).concat(s.endDeathIds||[]));return [...ids].map(id=>{let p=playerById(id);let rec=(s.deathRecords||[]).find(x=>x.id===id)||{};let will=(s.pendingConversions||[]).find(x=>x.id===id);return `<div class="card"><b>${esc(p?.name)}</b><div class="small">Rolle: ${esc(rec.role||p?.role||'–')} · Gabe: ${esc((rec.gift||p?.gift||[]).join(', ')||'keine')}</div><div>☠️ ${esc(rec.why||'Verstorben')}</div><div class="gold">Neue Rolle: ${will?.type==='vamp'?'Vampir in der nächsten Nacht':will?.type==='wolf'?'Werwolf':'Nein'}</div></div>`}).join('')||'<p>Keine Verstorbenen.</p>'}
function winCheck(){alert(checkWinner());}
const WINNERS=['Dorf','Werwölfe','Vampire','Spinne','Liebespaar','Brandstifter','Narr','Kopfgeldjäger','Einsamer Wolf','Reisender','Andere / unentschieden'];
function manualWin(){if(!s.players.length)return alert('Es ist keine Partie vorhanden.');s.page='winner';save();render()}
function winnerPage(){el(`<h2>🏆 Partie beenden</h2><p>Wähle die siegreiche Partei. Anschließend bestätigst du den endgültigen Abschluss.</p><div class="card"><h3>Sieger auswählen</h3><div class="win-grid">${WINNERS.map((w,i)=>btn(esc(w),'winnerPick_'+i)).join('')}</div></div><div class="actions">${btn('Zurück zum Spiel','resume')}</div>`)}
function winnerConfirm(index){let w=WINNERS[index];if(!w)return;el(`<h2>🏆 Sieg bestätigen</h2><div class="card"><p>Partie unwiderruflich als Sieg für folgende Partei abschließen?</p><h2 class="gold">${esc(w)}</h2><div class="actions">${btn('Ja, Partie beenden','winnerCommit_'+index,'primary')} ${btn('Andere Partei auswählen','manualWin')}</div></div>`)}
function winnerCommit(index){let w=WINNERS[index];if(!w||!s.players.length)return;s.winner='Manuell festgelegter Sieg: '+w;s.victoryName=w;s.ended=true;s.phase='afterDay';s.page='victory';log(s.winner);save();render()}
function victoryPage(){
 const winner=s.victoryName || String(s.winner||'Gewonnen').replace(/^Manuell festgelegter Sieg: /,'');
 const survivors=alive();
 const roster=survivors.length?survivors.map(p=>esc(p.name)).join(', '):'Keine';
 el(`<section class="victory-page" aria-label="Partie beendet"><div class="victory-glow"></div><div class="victory-crown" aria-hidden="true">🏆</div><div class="victory-kicker">DIE PARTIE IST BEENDET</div><h2 class="victory-title">${esc(winner)}</h2><div class="victory-sub">hat ${winner==='Andere / unentschieden'?'das Spiel beendet':'gewonnen'}!</div><div class="card victory-info"><h3>Abschluss der Partie</h3><div class="row"><span>Spielrunde</span><b>Tag ${s.day||1}</b></div><div class="row"><span>Teilnehmende</span><b>${s.players.length}</b></div><div class="row"><span>Noch lebend</span><b>${survivors.length}</b></div><div class="row"><span>Überlebende</span><b style="max-width:62%;text-align:right">${roster}</b></div></div><div class="victory-actions">${btn('📜 Protokoll ansehen','log')}${btn('🏠 Zum Menü','home','primary')}${btn('Neue Partie','new')}</div><p class="small" style="margin-top:18px">Der Spielabschluss ist gespeichert. Du kannst diese Ansicht über „Partie fortsetzen“ erneut öffnen.</p></section>`);
}
function testsPage(){el(`<h2>🧪 Testmodus</h2><p>Automatische Regel- und Ablaufprüfungen mit Testspielern. Deine laufende Partie und deine gespeicherten Einstellungen werden dabei nicht verändert.</p><div class="card"><div class="actions">${btn('Tests starten','runTests','primary')} ${btn('Zurück','home')}</div></div><div id="testResults" class="card"><p>Noch keine Prüfungen ausgeführt.</p></div>`)}
function runTests(){const original=s, results=[];const check=(label,test)=>{try{if(!test())throw Error('Erwartetes Ergebnis nicht erreicht');results.push({label,ok:true})}catch(e){results.push({label,ok:false,why:String(e.message||e)})}};
const mk=(id,role,extra={})=>({id,name:'Test '+id,role,original:role,gift:[],alive:true,injured:false,ghostVote:false,web:false,gas:false,...extra});
try{
 s={...original,count:11,poolExtra:0,roles:{'Werwolf':3,'Dorfbewohner':8},pool:[],gifts:[],players:Array.from({length:11},(_,i)=>mk(i+1,i<3?'Werwolf':'Dorfbewohner')),day:1,phase:'night',used:{},events:[]};
 check('11 Rollen bei 11 Spielern sind gültig',()=>validation()==='');
 s.roles.Dorfbewohner=9;check('12 Rollen bei 11 Spielern werden abgelehnt',()=>validation().includes('12 Rollen für 11 Personen'));s.roles.Dorfbewohner=8;
 check('Drei Werwölfe in einer 11er-Partie',()=>s.players.filter(p=>p.role==='Werwolf').length===3);
 check('Mehr Werwölfe als Dorfbewohner ergibt nur einen Sieg-Hinweis',()=>{s.players.slice(3,8).forEach(p=>p.alive=false);return checkWinner().includes('Möglicher Wolfsieg')});
 s.players.forEach(p=>p.alive=true);s.pool=['Spinne','Seherin'];check('Unverteilte Rollen erscheinen in der Nachtansage',()=>nightSteps().some(x=>x.role==='Spinne'&&x.placeholder));
 s.players[3].role='Seherin';s.players[3].original='Seherin';s.players[3].alive=false;check('Verstorbene Seherin erhält Platzhalter',()=>nightSteps().some(x=>x.role==='Seherin'&&x.placeholder));
 s.players[3].alive=true;check('Lebende Seherin erhält echten Nacht-Schritt',()=>nightSteps().some(x=>x.role==='Seherin'&&!x.placeholder));
 check('Seherin erkennt Werwolf als böse',()=>see(s.players[0])==='Böse');
 s.players[0].role='Wolfsschamanin';check('Wolfsschamanin wird als gut gesehen',()=>see(s.players[0])==='Gut');s.players[0].role='Werwolf';
 s.players[4].role='Bürgermeister';check('Bürgermeister hat zwei Stimmen',()=>voteWeight(s.players[4])===2);
 s.players[4].gift=['Idiot'];check('Idiot hat keine Stimme, auch als Bürgermeister',()=>voteWeight(s.players[4])===0);
 s.players[4].gift=[];s.players[4].gas=true;check('Betrunkene Person hat keine Stimme',()=>voteWeight(s.players[4])===0);
 s.players[4].gas=false;s.players[5].lover=7;s.players[6].lover=6;s.players.forEach(p=>p.alive=[6,7].includes(p.id));check('Liebespaar als letzte zwei Lebende wird erkannt',()=>checkWinner().includes('Liebespaar-Sieg'));
 s.players.forEach(p=>p.alive=true);s.winner=null;check('Sieg-Auswahl bietet alle Parteien',()=>WINNERS.includes('Dorf')&&WINNERS.includes('Liebespaar')&&WINNERS.includes('Werwölfe'));
 check('Geisterstimme nach Tod noch verfügbar',()=>{s.players[8].alive=false;return !s.players[8].ghostVote});
}finally{s=original}
let pass=results.filter(x=>x.ok).length;let box=$('testResults');if(box)box.innerHTML=`<h3>${pass} von ${results.length} Tests bestanden</h3>${results.map(x=>`<div class="test-row"><b class="${x.ok?'test-pass':'test-fail'}">${x.ok?'✓':'✗'}</b> ${esc(x.label)} ${x.why?`<p class="warn">${esc(x.why)}</p>`:''}</div>`).join('')}<p class="small">Automatische Grundtests sind kein vollständiger Test aller Kombinationen und aller Bedienabläufe.</p>`;
}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.role){let r=b.dataset.role,n=(s.roles[r]||0)+(+b.dataset.delta);s.roles[r]=Math.max(0,Math.min(30,n));s.difficulty='Custom';save();render();return}let a=b.dataset.action;if(!a)return;
if(a==='home')setPage('home');else if(a==='tests')setPage('tests');else if(a==='runTests')runTests();else if(a.startsWith('winnerPick_'))winnerConfirm(+a.slice(11));else if(a.startsWith('winnerCommit_'))winnerCommit(+a.slice(13));else if(a==='new'){if(s.players.length&&!confirm('Neue Partie beginnen? Die laufende Partie wird dabei überschrieben.'))return;let previous=s.lastSettings||{count:s.count,poolExtra:s.poolExtra,difficulty:s.difficulty,roles:s.roles,pool:s.pool,gifts:s.gifts};s.count=previous.count||11;s.poolExtra=previous.poolExtra??3;s.difficulty=previous.difficulty||'Einsteiger';s.roles={...previous.roles};s.pool=[...(previous.pool||[])];s.gifts=[...(previous.gifts||[])];s.players=[];s.ended=false;setPage('settings')}else if(a==='settings')setPage('settings');else if(a==='resume'){s.page='game';save();render()}else if(a==='wipe'){let b=document.querySelector('[data-action=wipe][data-armed=true]');if(!b){document.querySelectorAll('[data-action=wipe]').forEach(x=>{x.dataset.armed='true';x.textContent='Löschen bestätigen';x.classList.add('danger')});return}deleteGame()}else if(a==='toNames'){let v=validation();if(v)return alert(v);setPage('names')}else if(a==='names')setPage('names');else if(a==='deal'){let names=[...document.querySelectorAll('[data-name]')].map(e=>e.value.trim());if(names.some(x=>!x))return alert('Bitte alle Namen ausfüllen.');if(new Set(names.map(x=>x.toLowerCase())).size!==names.length)return alert('Namen müssen eindeutig sein.');s.savedNames=names;s.draftNames=names;initialDeal();setPage('deal')}else if(a==='reshuffle'){if(confirm('Rollen neu mischen?')){initialDeal();render()}}else if(a==='start'){let issue=validation();if(issue)return alert(issue);if(s.players.length!==s.count)return alert(`Spielstart nicht möglich: ${s.players.length} Spieler statt ${s.count}.`);s.page='game';newNight()}else if(a==='nextNight'){s.day++;newNight()}else if(a==='next')next();else if(a==='prev'){s.nightIndex=Math.max(0,s.nightIndex-1);save();render()}else if(a==='finishNight'){if(confirm('Nacht abschließen und Aktionen auflösen?'))resolveNight()}else if(a.startsWith('act_'))act(a.slice(4));else if(a.startsWith('side_')){let p=playerById(s.steps[s.nightIndex].actor);p.side=a.slice(5);log(`Wolfshund entscheidet sich für ${p.side}`);next()}else if(a==='steal'){let p=playerById(s.steps[s.nightIndex].actor),r=$('pick').value;if(!r)return alert('Keine freien Rollen');p.role=r;s.pool.splice(s.pool.indexOf(r),1);s.acts.thiefDone=true;log(`Dieb wird ${r}`);next()}else if(a==='webkill'){s.acts.fire=true;s.used.webkill=true;log('Spinne löst das Netz aus.');next()}else if(a==='witchBoth'){let heal=+($('healTarget')?.value||0),poison=+($('poisonTarget')?.value||0);if(heal&&s.used.heal)return alert('Heiltrank bereits verbraucht.');if(poison&&s.used.poison)return alert('Todestrank bereits verbraucht.');if(heal){s.acts.heal=heal;s.used.heal=true;log('Hexe: Heiltrank auf '+name(heal))}if(poison){s.acts.poison=poison;s.used.poison=true;log('Hexe: Todestrank auf '+name(poison))}next()}else if(a==='shoot'){let shooter=byRole('Schütze')[0],p=playerById(+$('shotTarget').value);if(!shooter||!p)return alert('Schütze und Ziel wählen');let u='shot'+shooter.id;if((s.used[u]||0)>=2)return alert('Schüsse verbraucht.');s.used[u]=(s.used[u]||0)+1;let hitEvil=isEvil(p);kill(hitEvil?p:shooter,hitEvil?'Schütze – böse Kreatur':'Fehlschuss auf Dorfbewohner');s.nominees=(s.nominees||[]).filter(id=>playerById(id)?.alive);save();render();alert(hitEvil?`${p.name} ist tot! ${byRole('Schütze').length&&(s.used[u]||0)<2?'Der Schütze darf sofort seinen zweiten Schuss abgeben.':'Keine weiteren Schüsse verfügbar.'}`:`${shooter.name} hat einen Dorfbewohner getroffen und ist selbst gestorben. Die Schussoption wurde entfernt.`)}else if(a==='lynch'){let v=+$('lynch').value;if(v&&!(s.nominees||[]).includes(v))return alert('Ungültiges Urteil: Diese Person war nicht für die Abstimmung aufgestellt. Bitte zuerst nominieren.');if(v&&(!playerById(v)?.alive))return alert('Diese Person lebt nicht mehr.');resolveDay(v)}else if(a==='judge'){let p=alive().find(p=>p.gift.includes('Richter')&&!s.used['judge'+p.id]);if(p){s.used['judge'+p.id]=true;resolveDay(null,true)}}else if(a.startsWith('toggleAlive_')){let p=playerById(+a.split('_')[1]);p.alive=!p.alive;save();render()}else if(a.startsWith('toggleInjury_')){let p=playerById(+a.split('_')[1]);p.injured=!p.injured;save();render()}else if(a==='bear'){let panel=$('bearPanel');if(panel)panel.style.display=panel.style.display==='none'?'block':'none'}else if(a==='manualWin')manualWin();else if(a==='winCheck')winCheck();else if(a==='log')setPage('log');else if(a==='copyLog'){navigator.clipboard?.writeText(s.events.join('\n')).then(()=>alert('Kopiert')).catch(()=>alert('Kopieren nicht verfügbar'));}});
document.addEventListener('change',e=>{let d=e.target;if(d.id==='difficulty'&&d.value!=='Custom'){applyPreset(d.value)}else if(d.id==='difficulty'){s.difficulty='Custom';save()}else if(d.id==='count'){s.count=Math.max(5,Math.min(30,+d.value||11));save();render()}else if(d.id==='extra'){s.poolExtra=Math.max(0,Math.min(20,+d.value||0));save();render()}else if(d.dataset.pool){s.pool=d.checked?[...s.pool,d.dataset.pool]:s.pool.filter(x=>x!==d.dataset.pool);save();render()}else if(d.dataset.gift){s.gifts=d.checked?[...s.gifts,d.dataset.gift]:s.gifts.filter(x=>x!==d.dataset.gift);save();render()}else if(d.dataset.changeRole){playerById(d.dataset.changeRole).role=d.value;save()}else if(d.dataset.changeGift){playerById(d.dataset.changeGift).gift=d.value.split(',').map(x=>x.trim()).filter(x=>GIFTS.includes(x)).slice(0,1);if(playerById(d.dataset.changeGift).gift.includes('Lykanthrop')&&isEvil(playerById(d.dataset.changeGift))){playerById(d.dataset.changeGift).gift=[];alert('Lykanthrop darf keine böse Rolle erhalten.')}save()}else if(d.dataset.nom){s.nominees=s.nominees||[];s.nominees=d.checked?[...s.nominees,+d.dataset.nom]:s.nominees.filter(x=>x!==+d.dataset.nom);save();render()}else if(d.dataset.ghost){playerById(d.dataset.ghost).ghostVote=d.checked;save()}});
$('home').onclick=()=>setPage('home');render();
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(e=>console.warn('Offline-Cache:',e)));}
</script></body></html>
